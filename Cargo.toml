[package]
name = "bluebus"
version = "0.1.11"
edition = "2021"
rust-version = "1.89"
description = "Async Bluetooth and BLE library for Linux: scan, connect, pair, GATT client and server, LE advertising and device events through BlueZ over D-Bus (pure Rust, zbus)."
authors = ["Samet Eraslan <absameteraslan@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bluebus-rs/bluebus"
documentation = "https://docs.rs/bluebus"
keywords = ["bluetooth", "ble", "bluez", "gatt", "dbus"]
categories = ["os::linux-apis", "api-bindings", "hardware-support"]
readme = "./README.md"

[dependencies]
futures = "0.3.31"
lazy_static = "1.5.0"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1"
zbus = "5.5.0"

[lib]
name = "bluebus"
path = "src/lib.rs"
crate-type = ["lib"]
