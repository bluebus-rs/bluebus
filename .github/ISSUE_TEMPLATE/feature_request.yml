name: Feature request
description: A BlueZ feature, profile or API you'd like
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: The feature, and what you want to use it for.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do today
      description: How you work around it now, if at all.
